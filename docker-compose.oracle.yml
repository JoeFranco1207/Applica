version: '3.8'

services:
  backend:
    build: ./backend
    container_name: applica_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/usr/src/app

  frontend:
    build: ./frontend
    container_name: applica_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/src/app

# Note: adjust volumes and environment values as needed. In production you may prefer not to mount source.
